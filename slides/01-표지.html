<!doctype html>
<html lang="ko"><head>
<title>표지</title>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root { --paper:#fbf7ef; --ink:#2b2a27; --muted:#6f6a60; --accent:#c8553d; --leaf:#4a7c59; --card:#ffffff; --line:#e6dfd1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1280px; height:720px; overflow:hidden; }
  body { word-break:keep-all; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .slide { position:relative; width:1280px; height:720px; padding:72px 96px; display:flex; flex-direction:column; }
  .eyebrow { font-size:22px; font-weight:700; color:var(--accent); letter-spacing:.08em; }
  h1, h2 { font-family:"Gowun Batang",serif; font-weight:700; line-height:1.3; }
  h2 { font-size:52px; margin:12px 0 40px; }
  .num { position:absolute; right:56px; bottom:36px; font-size:18px; color:var(--muted); }
  .cards { display:grid; gap:28px; flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:36px 32px; }
  .card .icon { font-size:48px; margin-bottom:16px; }
  .card h3 { font-size:28px; margin-bottom:12px; }
  .card p { font-size:21px; line-height:1.6; color:var(--muted); }
</style>
<style>
  .slide { justify-content:center; padding-left:120px; }
  .slide::before { content:""; position:absolute; left:0; top:0; bottom:0; width:28px; background:var(--accent); }
  .books { position:absolute; right:110px; bottom:0; display:flex; align-items:flex-end; gap:10px; }
  .books span { display:block; width:46px; border-radius:6px 6px 0 0; }
  .eyebrow { margin-bottom:20px; }
  h1 { font-size:84px; margin-bottom:20px; }
  .sub { font-size:36px; color:var(--muted); font-family:"Gowun Batang",serif; }
  .meta { margin-top:72px; font-size:24px; display:flex; gap:32px; color:var(--ink); }
  .meta b { color:var(--leaf); }
</style>
</head><body>
<div class="slide">
  <div class="eyebrow">함께 읽는 교실</div>
  <h1>{{title}}</h1>
  <div class="sub">{{subtitle}}</div>
  <div class="meta"><span><b>발표</b> {{presenter}}</span><span><b>일시</b> {{date}}</span></div>
  <div class="books" aria-hidden="true">
    <span style="height:260px;background:#4a7c59"></span>
    <span style="height:320px;background:#e0a458"></span>
    <span style="height:220px;background:#c8553d"></span>
    <span style="height:290px;background:#3d5a80"></span>
    <span style="height:240px;background:#98c1d9"></span>
  </div>
</div>
</body></html>
