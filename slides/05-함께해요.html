<!doctype html>
<html lang="ko"><head>
<title>함께해요</title>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root { --paper:#fbf7ef; --ink:#2b2a27; --muted:#6f6a60; --accent:#c8553d; --leaf:#4a7c59; --card:#ffffff; --line:#e6dfd1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1280px; height:720px; overflow:hidden; }
  body { word-break:keep-all; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  .slide { position:relative; width:1280px; height:720px; padding:72px 96px; display:flex; flex-direction:column; }
  .eyebrow { font-size:22px; font-weight:700; color:var(--accent); letter-spacing:.08em; }
  h1, h2 { font-family:"Gowun Batang",serif; font-weight:700; line-height:1.3; }
  h2 { font-size:52px; margin:12px 0 40px; }
  .num { position:absolute; right:56px; bottom:36px; font-size:18px; color:var(--muted); }
  .cards { display:grid; gap:28px; flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:36px 32px; }
  .card .icon { font-size:48px; margin-bottom:16px; }
  .card h3 { font-size:28px; margin-bottom:12px; }
  .card p { font-size:21px; line-height:1.6; color:var(--muted); }
</style>
<style>
  .slide { justify-content:center; align-items:center; text-align:center; }
  h2 { font-size:64px; margin:16px 0 28px; }
  .lead { font-size:28px; color:var(--muted); line-height:1.7; }
  .pill { margin-top:56px; display:inline-flex; gap:16px; }
  .pill span { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:14px 30px; font-size:22px; }
  .pill b { color:var(--accent); }
</style>
</head><body>
<div class="slide">
  <div class="eyebrow">TOGETHER</div>
  <h2>학교와 가정이 함께 읽어요</h2>
  <p class="lead">매일의 작은 20분이 아이의 평생 독서 습관이 됩니다.<br>궁금하신 점은 편하게 질문해 주세요.</p>
  <div class="pill"><span><b>Q&amp;A</b> 질의응답</span><span><b>문의</b> 알림장 · 학교 전화</span></div>
  <div class="num">{{page}} / {{total}}</div>
</div>
</body></html>
